{%- from "recipes/components.j2" import comps, component_env with context -%}

name: "{{ recipe_name }}"
tag: "{{ build_tag }}"
release: "{{ recipe_name }}-{{ build_tag }}"
desc: "This is a simple example image collection recipe"

steps:
  - name: simple-example-base
    base: "ubuntu:{{ images.base.ubuntu_tag }}"
    template: {{ images.base.template }}
    desc: |
      This is a simple example base image which builds on its base image
      ubuntu:{{ images.base.ubuntu_tag }} by adding these Ubuntu packages:

      {%- for pkg in comps.ubuntu.apt_packages %}
        - {{ pkg }}
      {%- endfor %}
    env:
      {{- component_env("base") }}

  - name: simple-example-venv
    base: simple-example-base
    template: {{ images.venv.template }}
    desc: |
      This image builds on its base image by creating a Python venv under
      directory {{ comps.venv.path }} and adding a few python packages.
    env:
      {{- component_env("venv") }}
