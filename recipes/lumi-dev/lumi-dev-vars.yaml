#
# Recipe lumi-dev: development images built on existing lumi-multitorch images
#
# Each component field becomes a build ARG named <NAME>_<FIELD>, for example
# FAISS_GPU_ARCH. Lists are joined with spaces. Image-level keys next to
# "components" are settings of the image itself and don't become build ARGs:
# "template" is the Containerfile template, and "base" the existing image
# (name:tag) the image is built on.
#
recipe_name: lumi-dev

# GPU architecture of all images, used below as "gpu_arch: *gpu_arch"
gpu_arch: &gpu_arch "gfx90a"

images:
#
# Image lumi-dev-faiss
#
  faiss:
    template: "dev/FAISS"
    base: "docker.io/lumiaifactory/lumi-multitorch:torch-u24r72f21m50t211"
    components:
      - name: faiss
        title: "FAISS"
        repo: "https://github.com/facebookresearch/faiss.git"
        version: "v1.16.0"
        gpu_arch: *gpu_arch
        # Parallel build jobs, empty for one per CPU core. Lower it if the
        # build runs out of memory.
        # jobs: "4"
        apt_packages:
          - swig

#
# Image lumi-dev-sglang
#
  sglang:
    template: "dev/SGLang"
    base: "docker.io/lumiaifactory/lumi-multitorch:torch-u24r72f21m50t211"
    components:
      - name: sglang
        title: "SGLang"
        repo: "https://github.com/sgl-project/sglang.git"
        version: "v0.5.22"
        gpu_arch: *gpu_arch
        # Parallel compile jobs of the kernel build, empty for one per CPU
        # core. Lower it if the build runs out of memory.
        # jobs: "4"
        build_rust_exts: "none"

#
# Image lumi-dev-jax
#
  jax:
    template: "dev/JAX"
    base: "docker.io/lumiaifactory/lumi-multitorch:mpich-u24r72f21m50t211"
    components:
      - name: jax
        title: "JAX"
        note: "prebuilt ROCm 7 wheels from PyPI"
        # 0.10.2 is the newest release with "Legacy ROCm" wheels on PyPI. The
        # PyPI wheels of later releases need TheRock ROCm 7.14 instead of the
        # ROCm 7.2 of the base image.
        version: "0.10.2"
        # rocm7-local: the ROCm plugin and PJRT wheels without ROCm from pip,
        # so JAX uses the system ROCm of the base image. xprof: the XProf
        # profiler for jax.profiler traces.
        pip_packages:
          - "jax[rocm7-local,xprof]=={version}"
        # Libraries installed with JAX. They are not pinned: pip picks the
        # newest versions that work with the JAX version above.
        extra_pip_packages:
          - flax
          - optax
          - orbax-checkpoint
          - grain
      - name: mpi4py
        title: "mpi4py"
        note: "built from the PyPI source against the MPICH of the base image"
        version: "4.1.2"
