# Each component field becomes a build ARG named <NAME>_<FIELD>, for example
#  template: "torch/Containerfile"
#  components:
#      - name: torch
#        gpu_arch: "gfx90a"
# becomes ARG TORCH_GPU_ARCH=gfx90a when rendered to torch/Containerfile.
#
# Lists are joined with spaces. Use "repo" for git repositories and "source"
# for release tarball download URLs. Values can refer to other fields of the
# same component as {field}, e.g. "amdrocm-core-sdk{version}-{gpu_arch}".
#
# Image-level keys next to "components" are settings of the image itself and
# don't become build ARGs, e.g. "template", the Containerfile template used
# for building the image.
#
# GPU architecture of all images, used below as "gpu_arch: *gpu_arch"
#
gpu_arch: &gpu_arch "gfx90a"
#
images:
#
#  ubuntu-rocm
#
  rocm:
    template: "rocm/Ubuntu2404_Rocm7"
    ubuntu_release: "24.04"
    ubuntu_tag: "noble-20260930.1"
    components:
      # Installed before ROCm: needed for adding the ROCm repository and as
      # the build and runtime base. Changing this list reinstalls ROCm.
      - name: base
        apt_packages:
          - build-essential
          - ca-certificates
          - cmake
          - curl
          - gnupg
          - kmod
          - libdw1t64
          - libnuma-dev
          - pkgconf
          - python3-dev
          - python3-packaging
          - python3-pip
          - python3-venv
          - wget
          - zstd
      - name: rocm
        repo: "https://repo.amd.com/rocm"
        version: "7.14"
        gpu_arch: *gpu_arch
        apt_packages:
          # ROCm SDK packages for this version and GPU architecture
          - amdrocm-core-sdk{version}-{gpu_arch}
          - amdrocm-hpc-sdk{version}-{gpu_arch}
          # - amdrocm7-rvs
          # Needed by ROCm's headers but not a dependency of its packages:
          # rocm_smi, amd_smi and hsakmt headers include libdrm ones
          - libdrm-dev
      # Installed after ROCm, so changing these doesn't reinstall ROCm.
      - name: extra
        apt_packages:
          - file
          - git
          - jq
          - less
          - libtcmalloc-minimal4
          - lsof
          - nano
          - neovim
          - screen
          - tmux
          - unzip
          - yq
        locales:
          - cs_CZ.UTF-8
          - da_DK.UTF-8
          - en_DK.UTF-8
          - en_US.UTF-8
          - et_EE.UTF-8
          - fi_FI.UTF-8
          - nb_NO.UTF-8
          - nn_NO.UTF-8
          - pl_PL.UTF-8

#
# ubuntu-rocm-libfabric
#
# For packages built from a git commit, "version" is the version prefix and
# the Ubuntu package version becomes <version>-<commit>.
#
  libfabric:
    template: "libfabric/Ubuntu_Rocm_Slingshot"
    components:
      - name: cassini-headers
        source: "https://github.com/HewlettPackard/shs-cassini-headers"
        version: "12.0.1" # Based on version LUMI's versions since Jan 2026 maint break
      - name: cxi-headers
        repo: "https://github.com/HewlettPackard/shs-cxi-driver"
        commit: "27f7be5" # Based on version LUMI's versions since Jan 2026 maint break
        version: "1.0.0-SHS12.0.2"
      - name: kdreg2-headers
        repo: "https://github.com/HewlettPackard/shs-kdreg2"
        commit: "746483b"
        version: "0.4-SHS12.0.2"
      - name: libcxi
        repo: "https://github.com/HewlettPackard/shs-libcxi"
        commit: "30fa2dd" # Based on version LUMI's versions since Jan 2026 maint break
        version: "1.0.2-SHS12.0.2"
      - name: libfabric
        repo: "https://github.com/ofiwg/libfabric"
        commit: "78d6e03"
        version: "2.1"
      - name: xpmem
        repo: "https://github.com/hpc/xpmem"
        commit: "3bcab55"
        version: "0.1"

#
# ubuntu-rocm-libfabric-mpich
#
  mpich:
    template: "mpich/Ubuntu_Rocm_Slingshot"
    components:
      - name: aws-ofi-nccl
        repo: "https://github.com/aws/aws-ofi-nccl"
        commit: "2475c4c" # Tagged as latest release (v1.21.1) as of 2026-09-04
        version: "1.21.1"
      - name: hwloc
        repo: "https://github.com/open-mpi/hwloc"
        version: "2.15.0" # Latest version as of 2026-10-19
        # Ubuntu packages for building hwloc: libpciaccess for the PCI plugin
        # and libxml2 for the full XML import and export support
        build_apt_packages:
          - libpciaccess-dev
          - libxml2-dev
        # Runtime libraries of hwloc and its PCI plugin
        apt_packages:
          - libpciaccess0
          - libxml2
      - name: mpich
        source: "http://www.mpich.org/static/downloads"
        version: "5.0.1" # Latest version as of 2026-07-13
        gpu_arch: *gpu_arch
      - name: osu
        source: "https://mvapich.cse.ohio-state.edu/download/mvapich"
        version: "7.5.2" # Latest version as of 2026-07-13
      - name: rccl-tests
        repo: "https://github.com/ROCm/rocm-systems"
        commit: "485afdf" # Tagged as release (therock-7.14.1) as of 2026-09-04
        gpu_arch: *gpu_arch

#
# ubuntu-rocm-libfabric-mpich-torch
#
  torch:
    template: "torch/Venv_Torch_From_Src"
    components:
      - name: torch
        repo: "https://github.com/pytorch/pytorch"
        version: "2.13.0"
        gpu_arch: *gpu_arch
        # patches:
        #   - "https://github.com/viahlgre/pytorch/commit/f0374f296279f6fbdb3437a144b226521d00b788.patch" # Disabled for PyTorch 2.13
        pip_packages:
          - mkl-include
          - mkl-static
        apt_packages:
          - ccache
          - libjpeg-dev
          # AOTriton, built from source when PyTorch has no prebuilt runtime for the ROCm version
          - liblzma-dev
          #
          - libopenblas-dev
          - libpng-dev
          - numactl
      - name: triton
        version: "3.7.1"
        pip_url: "https://repo.amd.com/rocm/whl-multi-arch/"
      - name: torchaudio
        version: "2.11.0"
        pip_url: "https://repo.amd.com/rocm/whl-multi-arch/"
      - name: torchcodec
        version: "0.17.0"
        pip_url: "https://download.pytorch.org/whl/cpu/"
      - name: torchvision
        version: "0.28.0"
        pip_url: "https://repo.amd.com/rocm/whl-multi-arch/"
      # - name: fake-triton
      #   repo: "https://github.com/viahlgre/fake-triton.git"
      #   commit: "d35f4ca"

#
# ubuntu-rocm-libfabric-mpich-torch-full
#
  multi:
    template: "multi/Rocm_Multipurpose"
    components:
      # Image-wide GPU architecture and the extra Ubuntu and Python packages
      - name: full
        gpu_arch: *gpu_arch
        apt_packages:
          # DeepSpeed
          - libaio-dev
          - libaio1t64
          # Ultralytics dependencies
          - ffmpeg
          # vLLM build
          - apt-transport-https
          - ca-certificates
          - libfmt-dev
          - libmsgpack-dev
          - libsqlite3-dev
          - libsuitesparse-dev
          - sqlite3
        pip_packages:
          - accelerate
          - bitsandbytes
          - datasets
          - evaluate
          - h5py
          - huggingface-hub
          - jupyter
          - lightning
          - marimo
          - matplotlib
          - mlflow
          - mpi4py
          - numba
          - pandas
          - peft
          - scipy
          - sentence-transformers
          - sentencepiece
          - tensorboard
          - trl
          - ultralytics-opencv-headless
      # Python packages needed for building the packages below
      - name: build
        pip_packages:
          # DeepSpeed OPS build
          # - impi-devel
          # - oneccl-devel
          # Flash-attention build
          # - ninja
          # - packaging
          # Megatron-LM
          - flask-restful
          - nltk
          - pybind11
          - pynvml
          - tensorstore
          - wandb
          - wrapt
          - zarr
          # vLLM build
          # - jinja2
          - setuptools_rust
          - setuptools_scm
      # - name: wretag
      #   repo: "https://github.com/lumi-ai-factory/wretag.git"
      #   commit: "0da1af0"
      - name: apex
        repo: "https://github.com/ROCm/apex"
        commit: "68f9dc9" # Latest from branch release/1.13.0 (this branch is specifically for Pytorch 2.13.0) as of 2026-10-19
      - name: causal-conv1d
        repo: "https://github.com/Dao-AILab/causal-conv1d"
        commit: "cd81f04" # Latest commit as of 2026-10-19
      - name: deepspeed
        version: "0.19.6" # Latest release as of 2026-09-11
      - name: flash-attention
        repo: "https://github.com/ROCm/flash-attention"
        # Last commit with version 2.8.3 (supported by Transformer Engine) as of 2026-07-31
        # https://github.com/ROCm/TransformerEngine/blob/v2.15_rocm/transformer_engine/pytorch/attention/dot_product_attention/utils.py#L126
        commit: "b664ea0"
      # Disabled until vLLM supports compressed-tensors 0.19, see Rocm_Multipurpose
      # - name: llmcompressor
      #   repo: "https://github.com/vllm-project/llm-compressor"
      #   commit: "6e4b96e" # Tagged as latest release (v0.14.0) as of 2026-10-19
      - name: megatron-lm
        repo: "https://github.com/ROCm/Megatron-LM"
        commit: "9784f40" # Latest from branch rocm_dev as of 2026-09-24
      - name: vllm
        repo: "https://github.com/vllm-project/vllm"
        commit: "5df63a7"  # Tagged as release "v0.32.0"
        version: "v0.32.0" # "v0.26.0" is build against PyTorch 2.13.0 as of 2026-10-19
      - name: xformers
        repo: "https://github.com/facebookresearch/xformers"
        commit: "03b91d7" # Tagged as latest release (v0.0.35) as of 2026-07-13

#
# ubuntu-rocm-libfabric-mpich-torch-full-plus
#
  plus:
    template: "plus/Plus"
    components:
      - name: transformer-engine
        repo: "https://github.com/ROCm/TransformerEngine"
        commit: "130099c" # v2.17 ROCm
        gpu_arch: *gpu_arch
